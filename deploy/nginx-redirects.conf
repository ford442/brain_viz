# Redirects for the brain_viz deployment at test.1ink.us.
#
# The app is served from /brain-viz/ (hyphen, see `base` in vite.config.js and
# TARGET_FOLDER in deploy.py), but the repo is named brain_viz, so people type
# the underscore form and get a 404. deploy.py only uploads files, so this
# lives in the server block for test.1ink.us — include it from there:
#
#     server {
#         server_name test.1ink.us;
#         include /path/to/brain_viz/deploy/nginx-redirects.conf;   # or paste it
#         ...
#     }
#
# Then `nginx -t && systemctl reload nginx`.

# /brain-viz -> /brain-viz/
location = /brain-viz {
    return 301 /brain-viz/$is_args$args;
}

# /brain_viz and /brain_viz/anything -> /brain-viz/
location = /brain_viz {
    return 301 /brain-viz/$is_args$args;
}
location ^~ /brain_viz/ {
    return 301 /brain-viz/$is_args$args;
}
