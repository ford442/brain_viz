name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # `npm run build` is web-only (vite build) and never requires an
      # Emscripten SDK. The WASM engine is an optional runtime feature
      # (wasm-engine.js falls back gracefully when the module is absent),
      # so it is not a build gate; `npm run build:full` opts into it locally.
      # naga validates every WGSL source in `npm test` (tests/test_wgsl_naga.js,
      # docs/tensor-physics.md §9.1). Pinned and cached: building it from
      # source is the slow part, and only happens on a cache miss.
      - name: Cache naga
        id: naga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-29.0.3-${{ runner.os }}

      - name: Install naga
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 29.0.3 --locked

      # Headless layout/shader assertions — plain Node, no WebGPU or browser.
      # These catch uniform-struct drift that the visual suite cannot see
      # (a clip plane read four floats off still renders an image).
      # REQUIRE_NAGA=1: on this runner a missing naga is a failure, not a skip.
      # `npm test` also runs, in order: `npm run lint` (ESLint, eslint.config.js —
      # correctness only: duplicate keys, unused vars, bare 32 grid sizes,
      # wall-clock timers in routine handlers), `npm run typecheck` (tsc,
      # checkJs on for src/ minus the `@ts-nocheck` backlog; strict, so e.g. a
      # Promise like `device.lost` in a condition is TS2801) and `npm run knip`
      # (no orphan modules — knip.json lists the script entry points).
      - name: Node unit tests (uniform layout, shaders, naga, tensor physics, renderer facade, lint, typecheck, knip)
        run: npm test
        env:
          REQUIRE_NAGA: '1'

      # The C++ half of the neural-field contract (docs/tensor-physics.md).
      # It compiles the C++ engine (BTE_SRCS in scripts/wasm_flags.sh) with the runner's own C++17
      # compiler — no Emscripten — and compares two 24-step runs against the
      # fixtures the JS reference stepper produced. This is what catches the
      # engines drifting apart, which is exactly how the C++ path spent several
      # phases silently simulating a subset of the shader.
      - name: Golden field test (C++ engine vs JS reference)
        run: npm run test:golden

      - name: Build frontend (vite, no WASM)
        run: npm run build

      # Fails if any dist/assets/*.js chunk, or the total, grew >10% over
      # scripts/bundle-budget.json. Intended growth: `node
      # scripts/check-bundle-size.mjs --update` and commit the budget.
      - name: Bundle-size budget
        run: npm run check:bundle

      - name: Python smoke test
        run: python3 scripts/test_run.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright (Python)
        run: pip install playwright

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(python3 -m playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright OS dependencies
        run: python3 -m playwright install-deps chromium

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python3 -m playwright install chromium

      # The WGSL compute shader against the CPU reference on SwiftShader's
      # software WebGPU (docs/tensor-physics.md §9.2). Reported, not gating:
      # headless SwiftShader WebGPU has been too flaky to block on (see the
      # verification note below). It prints SKIP rather than passing when no
      # adapter comes up, and a real disagreement fails this step visibly.
      - name: WGSL oracle (compute shader vs CPU reference, SwiftShader)
        continue-on-error: true
        run: npm run test:wgsl

      # The WebGPU app itself on SwiftShader. Reported, not gating, like the
      # oracle: routine playback must keep running on WebGPU (the path every
      # other verification script skips), and each render style is compared
      # pixel-wise with verification/goldens/ (pixelmatch). Both SKIP without
      # an adapter.
      - name: WebGPU routine playback (SwiftShader)
        continue-on-error: true
        run: npm run verify:webgpu-routine

      - name: WebGPU style screenshots vs goldens (SwiftShader)
        continue-on-error: true
        run: npm run verify:webgpu-styles

      - name: Upload style diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-diffs
          path: verification/diffs/
          retention-days: 7
          if-no-files-found: ignore

      # Every other script in verification/ forces ?renderer=webgl and launches its
      # own dev server (see AGENTS.md #7) — WebGPU + SwiftShader is too flaky
      # for headless CI, so the WebGL2 fallback path is the CI-supported one.
      - name: Run verification suite (WebGL fallback)
        run: python3 verification/verify_suite.py

      - name: Upload verification screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots
          path: verification/**/*.png
          retention-days: 7
          if-no-files-found: ignore
